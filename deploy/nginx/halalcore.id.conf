# halalcore.id — Main Frontend (static files served by Nginx)
# Place in /etc/nginx/sites-available/halalcore.id.conf

# HTTP → HTTPS redirect
server {
    listen 80;
    listen [::]:80;
    server_name halalcore.id www.halalcore.id;

    # Let's Encrypt challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name halalcore.id www.halalcore.id;

    # SSL certificates (managed by Certbot)
    ssl_certificate /etc/letsencrypt/live/halalcore.id/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/halalcore.id/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Document root — static files from Vite build
    root /var/www/halalcore.id;
    index index.html;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml
        font/woff2;

    # Cache hashed static assets aggressively (Vite adds hash to filenames)
    location ~* \.(?:js|css|woff2?|ttf|eot|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location ~* \.(?:png|jpg|jpeg|gif|svg|webp)$ {
        expires 30d;
        add_header Cache-Control "public";
        access_log off;
    }

    # Proxy backend uploads directly if accessed via main domain
    location ^~ /uploads/ {
        proxy_pass http://127.0.0.1:8080/uploads/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Proxy social share endpoint to backend
    location ^~ /share/ {
        proxy_pass http://127.0.0.1:8080/share/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Social Media Bot Crawler Detection for /news/*
    # When WhatsApp, Facebook, Twitter, Telegram, LinkedIn, or Google Bot visits /news/:slug:
    # Proxy to backend /public/cms/news/:slug/share so they get the real article thumbnail!
    location ~* ^/news/([a-zA-Z0-9_-]+)$ {
        set $is_bot 0;
        if ($http_user_agent ~* "facebookexternalhit|WhatsApp|Twitterbot|TelegramBot|LinkedInBot|Slackbot|Discordbot|SkypeUriPreview|Googlebot|bingbot|DuckDuckBot|Baiduspider|YandexBot|Applebot") {
            set $is_bot 1;
        }

        if ($is_bot = 1) {
            proxy_pass http://127.0.0.1:8080/public/cms/news/$1/share;
            break;
        }

        try_files $uri $uri/ /index.html;
    }

    # SPA fallback — all routes to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
}
