# halalcore.id — Main Frontend (static files served by Nginx)
# Place in /etc/nginx/sites-available/halalcore.id.conf

# HTTP → HTTPS redirect
server {
    listen 80;
    listen [::]:80;
    server_name halalcore.id www.halalcore.id;

    # Let's Encrypt challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name halalcore.id www.halalcore.id;

    # SSL certificates (managed by Certbot)
    ssl_certificate /etc/letsencrypt/live/halalcore.id/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/halalcore.id/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Document root — static files from Vite build
    root /var/www/halalcore.id;
    index index.html;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml
        font/woff2;

    # Cache hashed static assets aggressively (Vite adds hash to filenames)
    location ~* \.(?:js|css|woff2?|ttf|eot|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location ~* \.(?:png|jpg|jpeg|gif|svg|webp)$ {
        expires 30d;
        add_header Cache-Control "public";
        access_log off;
    }

    # Proxy backend uploads directly if accessed via main domain
    location ^~ /uploads/ {
        proxy_pass http://127.0.0.1:8080/uploads/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Proxy dynamic XML sitemaps and RSS feed to backend
    location ~* ^/(sitemap\.xml|sitemap-news\.xml|rss\.xml|feed\.xml)$ {
        proxy_pass http://127.0.0.1:8080/$1;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Proxy social share endpoint to backend
    location ^~ /share/ {
        proxy_pass http://127.0.0.1:8080/share/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 0. Advanced Bot Pre-rendering for Root Homepage (/)
    location = / {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        if ($http_user_agent ~* "Googlebot|Google-InspectionTool|Storebot-Google|Google-PageRenderer|Mediapartners-Google|bingbot|BingPreview|msnbot|DuckDuckBot|Baiduspider|YandexBot|Applebot|crawlers|archive.org_bot|Sogou|Exabot|facebot|facebookexternalhit|WhatsApp|Twitterbot|TelegramBot|LinkedInBot|Slackbot|Discordbot|Pinterestbot") {
            proxy_pass http://127.0.0.1:8080/public/cms/landing/render;
            break;
        }

        try_files /index.html =404;
    }

    # 1. Advanced Bot Pre-rendering for /news Listing Page (/news and /news/)
    location ~* ^/news/?$ {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        if ($http_user_agent ~* "Googlebot|Google-InspectionTool|Storebot-Google|Google-PageRenderer|Mediapartners-Google|bingbot|BingPreview|msnbot|DuckDuckBot|Baiduspider|YandexBot|Applebot|crawlers|archive.org_bot|Sogou|Exabot|facebot|facebookexternalhit|WhatsApp|Twitterbot|TelegramBot|LinkedInBot|Slackbot|Discordbot|Pinterestbot") {
            proxy_pass http://127.0.0.1:8080/public/cms/news/render;
            break;
        }

        try_files $uri $uri/ /index.html;
    }

    # 2. Advanced Bot Pre-rendering for /news/:slug Article Pages
    # - Search Engine Bots (Googlebot, Inspection Tool, Bingbot, etc.) receive Full Pre-rendered Semantic HTML
    # - Social Media Bots (WhatsApp, Facebook, Twitter, LinkedIn) receive rich OpenGraph card metadata
    # - Regular users receive the fast client-side Vite SPA
    location ~* ^/news/([a-zA-Z0-9_-]+)/?$ {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        if ($http_user_agent ~* "Googlebot|Google-InspectionTool|Storebot-Google|Google-PageRenderer|Mediapartners-Google|bingbot|BingPreview|msnbot|DuckDuckBot|Baiduspider|YandexBot|Applebot|crawlers|archive.org_bot|Sogou|Exabot") {
            proxy_pass http://127.0.0.1:8080/public/cms/news/$1/render;
            break;
        }

        if ($http_user_agent ~* "facebookexternalhit|facebot|WhatsApp|Twitterbot|TelegramBot|LinkedInBot|Slackbot|Discordbot|SkypeUriPreview|Pinterestbot") {
            proxy_pass http://127.0.0.1:8080/public/cms/news/$1/share;
            break;
        }

        try_files $uri $uri/ /index.html;
    }

    # SPA fallback — all routes to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
}
