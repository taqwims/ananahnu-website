name: Build & Deploy to Production VPS

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  # ─── 1. Build Backend Binary (Linux AMD64) ───
  build-backend:
    name: Build Go Backend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache-dependency-path: backend/go.sum

      - name: Build Binary
        working-directory: backend
        run: |
          go mod download
          GOOS=linux GOARCH=amd64 go build -ldflags="-w -s" -o main-linux ./cmd/api

      - name: Upload Backend Binary Artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-dist
          path: backend/main-linux
          retention-days: 1

  # ─── 2. Build Frontend (React Vite) ───
  build-frontend:
    name: Build Frontend (halalcore.id)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install & Build
        working-directory: frontend
        run: |
          if [ -f ".env.production" ]; then cp .env.production .env; fi
          npm ci --production=false
          npm run build
          tar -czf frontend-dist.tar.gz dist/

      - name: Upload Frontend Artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/frontend-dist.tar.gz
          retention-days: 1

  # ─── 3. Build Telemarketing (React Vite) ───
  build-telemarketing:
    name: Build Telemarketing (telemarketing.halalcore.id)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: telemarketing/package-lock.json

      - name: Install & Build
        working-directory: telemarketing
        run: |
          if [ -f ".env.production" ]; then cp .env.production .env; fi
          npm ci --production=false
          npm run build
          tar -czf telemarketing-dist.tar.gz dist/

      - name: Upload Telemarketing Artifact
        uses: actions/upload-artifact@v4
        with:
          name: telemarketing-dist
          path: telemarketing/telemarketing-dist.tar.gz
          retention-days: 1

  # ─── 4. Deploy Artifacts to VPS ───
  deploy:
    name: Deploy to VPS
    needs: [build-backend, build-frontend, build-telemarketing]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code (for Nginx configs)
        uses: actions/checkout@v4

      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare Upload Package
        run: |
          mkdir -p bundle
          
          # Find and move backend binary
          find artifacts/backend-dist -type f -name "main-linux" -exec cp {} bundle/main-linux \;
          
          # Find and move frontends tar.gz
          find artifacts/frontend-dist -type f -name "frontend-dist.tar.gz" -exec cp {} bundle/frontend-dist.tar.gz \;
          find artifacts/telemarketing-dist -type f -name "telemarketing-dist.tar.gz" -exec cp {} bundle/telemarketing-dist.tar.gz \;
          
          # Copy Nginx configs
          cp deploy/nginx/*.conf bundle/

      - name: Copy Files to VPS via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          passphrase: ${{ secrets.VPS_PASSPHRASE }}
          port: ${{ secrets.VPS_PORT || 22 }}
          source: "bundle/*"
          target: "/tmp"
          strip_components: 1

      - name: Execute Deployment on VPS
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          passphrase: ${{ secrets.VPS_PASSPHRASE }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script_stop: true
          script: |
            set -e
            echo "🚀 Deploying updates to VPS..."

            # 1. Update Backend Binary
            mkdir -p /root/ananahnu-website/backend /opt/halalcore/backend
            
            if [ -f "/tmp/main-linux" ]; then
              cp /tmp/main-linux /root/ananahnu-website/backend/main
              chmod +x /root/ananahnu-website/backend/main
              
              # Update /opt/halalcore/backend/server jika service mengarah ke sana
              cp /tmp/main-linux /opt/halalcore/backend/server 2>/dev/null || true
              chmod +x /opt/halalcore/backend/server 2>/dev/null || true
              chown -R halalcore:halalcore /opt/halalcore/backend 2>/dev/null || true
              
              rm -f /tmp/main-linux
            fi

            # Restart service backend
            systemctl restart halalcore-backend || true
            echo "✓ Backend binary updated & service restarted"

            # 2. Update Frontend (halalcore.id)
            if [ -f "/tmp/frontend-dist.tar.gz" ]; then
              cd /root/ananahnu-website/frontend/ 2>/dev/null || cd /tmp
              tar -xzf /tmp/frontend-dist.tar.gz
              mkdir -p /var/www/halalcore.id
              rm -rf /var/www/halalcore.id/*
              cp -r dist/* /var/www/halalcore.id/
              rm -rf dist /tmp/frontend-dist.tar.gz
              echo "✓ Frontend (halalcore.id) updated"
            fi

            # 3. Update Telemarketing (telemarketing.halalcore.id)
            if [ -f "/tmp/telemarketing-dist.tar.gz" ]; then
              cd /root/ananahnu-website/telemarketing/ 2>/dev/null || cd /tmp
              tar -xzf /tmp/telemarketing-dist.tar.gz
              mkdir -p /var/www/telemarketing.halalcore.id
              rm -rf /var/www/telemarketing.halalcore.id/*
              cp -r dist/* /var/www/telemarketing.halalcore.id/
              rm -rf dist /tmp/telemarketing-dist.tar.gz
              echo "✓ Telemarketing (telemarketing.halalcore.id) updated"
            fi

            # 4. Update Nginx Configs
            if [ -f "/tmp/halalcore.id.conf" ]; then
              cp /tmp/*.conf /etc/nginx/sites-available/ 2>/dev/null || true
              ln -sf /etc/nginx/sites-available/halalcore.id.conf /etc/nginx/sites-enabled/
              ln -sf /etc/nginx/sites-available/telemarketing.halalcore.id.conf /etc/nginx/sites-enabled/
              ln -sf /etc/nginx/sites-available/api.halalcore.id.conf /etc/nginx/sites-enabled/
              rm -f /tmp/*.conf
            fi

            # 5. Set Permissions & Reload Nginx
            chown -R www-data:www-data /var/www/halalcore.id /var/www/telemarketing.halalcore.id
            chmod -R 755 /var/www/halalcore.id /var/www/telemarketing.halalcore.id

            nginx -t
            systemctl reload nginx
            echo "✓ Nginx reloaded"

            echo "🎉 Deployment finished successfully!"
