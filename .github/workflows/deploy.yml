name: Build & Deploy to Production VPS

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  # ─── 1. Build Backend Binary (Linux AMD64) ───
  build-backend:
    name: Build Go Backend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache-dependency-path: backend/go.sum

      - name: Build Binary
        working-directory: backend
        run: |
          go mod download
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -ldflags="-w -s" -o server ./cmd/api

      - name: Upload Backend Binary Artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-dist
          path: |
            backend/server
            backend/templates/
          retention-days: 1

  # ─── 2. Build Frontend (React Vite) ───
  build-frontend:
    name: Build Frontend (halalcore.id)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install & Build
        working-directory: frontend
        run: |
          if [ -f ".env.production" ]; then cp .env.production .env; fi
          npm ci --production=false
          npm run build

      - name: Upload Frontend Artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/
          retention-days: 1

  # ─── 3. Build Telemarketing (React Vite) ───
  build-telemarketing:
    name: Build Telemarketing (telemarketing.halalcore.id)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: telemarketing/package-lock.json

      - name: Install & Build
        working-directory: telemarketing
        run: |
          if [ -f ".env.production" ]; then cp .env.production .env; fi
          npm ci --production=false
          npm run build

      - name: Upload Telemarketing Artifact
        uses: actions/upload-artifact@v4
        with:
          name: telemarketing-dist
          path: telemarketing/dist/
          retention-days: 1

  # ─── 4. Deploy Artifacts to VPS ───
  deploy:
    name: Deploy to VPS (Artifacts Only)
    needs: [build-backend, build-frontend, build-telemarketing]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code (for Nginx configs & Service files)
        uses: actions/checkout@v4

      - name: Download Backend Artifact
        uses: actions/download-artifact@v4
        with:
          name: backend-dist
          path: dist-backend

      - name: Download Frontend Artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: dist-frontend

      - name: Download Telemarketing Artifact
        uses: actions/download-artifact@v4
        with:
          name: telemarketing-dist
          path: dist-telemarketing

      - name: Package Release Bundle
        run: |
          mkdir -p release-bundle/nginx release-bundle/backend release-bundle/frontend release-bundle/telemarketing
          
          # Backend binary & templates
          cp dist-backend/backend/server release-bundle/backend/server
          chmod +x release-bundle/backend/server
          if [ -d "dist-backend/backend/templates" ]; then
            cp -r dist-backend/backend/templates release-bundle/backend/
          fi
          
          # Frontends
          cp -r dist-frontend/* release-bundle/frontend/
          cp -r dist-telemarketing/* release-bundle/telemarketing/
          
          # Nginx & Systemd configs
          cp deploy/nginx/*.conf release-bundle/nginx/
          cp deploy/halalcore-backend.service release-bundle/
          
          tar -czf release.tar.gz -C release-bundle .

      - name: Copy Release to VPS via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          passphrase: ${{ secrets.VPS_PASSPHRASE }}
          port: ${{ secrets.VPS_PORT || 22 }}
          source: "release.tar.gz"
          target: "/tmp"

      - name: Execute Remote Deployment on VPS
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          passphrase: ${{ secrets.VPS_PASSPHRASE }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script_stop: true
          script: |
            set -e
            echo "🚀 Deploying pre-built artifacts to VPS..."

            # 1. Extract bundle to temporary directory
            DEPLOY_TMP=$(mktemp -d)
            tar -xzf /tmp/release.tar.gz -C "$DEPLOY_TMP"
            rm -f /tmp/release.tar.gz

            # 2. Deploy Backend Binary & Templates
            mkdir -p /opt/halalcore/backend/uploads /opt/halalcore/backend/paymentproof /opt/halalcore/backend/consultant /opt/halalcore/backend/temp_docx /opt/halalcore/backend/templates
            
            # Stop backend briefly to replace binary
            systemctl stop halalcore-backend || true
            cp "$DEPLOY_TMP/backend/server" /opt/halalcore/backend/server
            chmod +x /opt/halalcore/backend/server
            
            if [ -d "$DEPLOY_TMP/backend/templates" ]; then
              cp -r "$DEPLOY_TMP/backend/templates/"* /opt/halalcore/backend/templates/ 2>/dev/null || true
            fi
            
            chown -R halalcore:halalcore /opt/halalcore/backend

            # 3. Deploy Frontend (halalcore.id)
            mkdir -p /var/www/halalcore.id
            rm -rf /var/www/halalcore.id/*
            cp -r "$DEPLOY_TMP/frontend/"* /var/www/halalcore.id/
            chown -R www-data:www-data /var/www/halalcore.id

            # 4. Deploy Telemarketing (telemarketing.halalcore.id)
            mkdir -p /var/www/telemarketing.halalcore.id
            rm -rf /var/www/telemarketing.halalcore.id/*
            cp -r "$DEPLOY_TMP/telemarketing/"* /var/www/telemarketing.halalcore.id/
            chown -R www-data:www-data /var/www/telemarketing.halalcore.id

            # 5. Update Nginx Configs
            cp "$DEPLOY_TMP/nginx/"*.conf /etc/nginx/sites-available/
            ln -sf /etc/nginx/sites-available/halalcore.id.conf /etc/nginx/sites-enabled/
            ln -sf /etc/nginx/sites-available/telemarketing.halalcore.id.conf /etc/nginx/sites-enabled/
            ln -sf /etc/nginx/sites-available/api.halalcore.id.conf /etc/nginx/sites-enabled/

            # 6. Update Systemd Service file
            cp "$DEPLOY_TMP/halalcore-backend.service" /etc/systemd/system/halalcore-backend.service
            systemctl daemon-reload

            # 7. Reload Nginx & Start Backend
            nginx -t
            systemctl reload nginx
            systemctl restart halalcore-backend

            # Clean temporary files
            rm -rf "$DEPLOY_TMP"
            echo "✅ Deployment finished! All services are active and running."
